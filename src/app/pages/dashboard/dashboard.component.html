<div class="container-fluid p-4">
  
  <h2 class="mb-4">Dashboard Overview</h2>

  <div class="row mb-4" *ngIf="stats">
    
    <div class="col-md-3">
      <div class="stat-card bg-primary text-white">
        <h3>{{ totalVehicles }}</h3>
        <p>Total Vehicles</p>
        <i class="bi bi-car-front-fill card-icon"></i>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card bg-success text-white">
        <h3>{{ stats.onRoad }}</h3>
        <p>Active / On Road</p>
        <i class="bi bi-speedometer2 card-icon"></i>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card bg-info text-white">
        <h3>{{ stats.availableVehicles }}</h3>
        <p>Available for Rent</p>
        <i class="bi bi-check-circle card-icon"></i>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card bg-danger text-white">
        <h3>{{ stats.inMaintenance }}</h3>
        <p>In Maintenance</p>
        <i class="bi bi-tools card-icon"></i>
      </div>
    </div>

  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-white">
      <h5 class="mb-0">Recent Activities</h5>
    </div>
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Message</th>
            <th>Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of activities">
            <td>{{ item.message }}</td>
            <td>{{ item.time }}</td>
            <td>
              <span [ngClass]="{
                'badge bg-success': item.type === 'success',
                'badge bg-warning text-dark': item.type === 'warning',
                'badge bg-info text-dark': item.type === 'info'
              }">{{ item.type | uppercase }}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

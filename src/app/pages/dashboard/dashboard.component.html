<div class="container-fluid p-4">
  <div class="dashboard-header">
    <h2 class="mb-4 fw-semibold">Dashboard Overview</h2>
  </div>

  <div *ngIf="loading" class="text-center text-muted">Loading data...</div>

  <div class="stats-wrapper" *ngIf="!loading">
    <div class="stat-box">
      <h3>{{ stats?.totalVehicles }}</h3>
      <p>Total Vehicles</p>
    </div>

    <div class="stat-box">
      <h3>{{ stats?.availableVehicles }}</h3>
      <p>Available</p>
    </div>

    <div class="stat-box">
      <h3>{{ stats?.onRoad }}</h3>
      <p>Rented</p>
    </div>

    <div class="stat-box">
      <h3>{{ stats?.inMaintenance }}</h3>
      <p>In Maintenance</p>
    </div>
  </div>
</div>

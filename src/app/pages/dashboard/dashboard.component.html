<div class="dashboard-container">
  <div class="dashboard-header">
    <h2 class="mb-4 fw-semibold">Dashboard Overview</h2>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon"><i class="bi bi-truck-front-fill"></i></div>
      <h3>{{ stats?.totalVehicles || 0 }}</h3>
      <p>Total Vehicles</p>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="bi bi-car-front-fill"></i></div>
      <h3>{{ stats?.availableVehicles || 0 }}</h3>
      <p>Available</p>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="bi bi-hourglass-split"></i></div>
      <h3>{{ stats?.rented || 0 }}</h3>
      <p>Rented</p>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="bi bi-tools"></i></div>
      <h3>{{ stats?.inmaintance || 0 }}</h3>
      <p>In Maintenance</p>
    </div>
  </div>

  <!-- Content Boxes Row -->
  <div class="content-row">
    <div class="content-card">
      <div class="card-header">
        <h3>Recent Activity</h3>
        <!-- <button class="btn btn-sm btn-light">View All</button> -->
      </div>
      
      <div class="activity-feed">
        <div *ngFor="let activity of activities" class="feed-item">
          <div class="feed-icon" [ngClass]="{
                'bg-success': activity.type === 'success',
                'bg-warning': activity.type === 'warning',
                'bg-info': activity.type === 'info',
              }">
            <i class="bi bi-bell-fill text-white" style="font-size: 0.7rem"></i>
          </div>

          <div class="feed-content">
            <p class="feed-text">{{ activity.message }}</p>
            <span class="feed-date">{{ activity.time }}</span>
          </div>
        </div>

        <div *ngIf="activities.length === 0" class="empty-state">
          <i class="bi bi-inbox"></i>
          <p>No recent activity</p>
        </div>
      </div>
    </div>

    <div class="content-card">
      <div class="card-header">
        <h3>Quick Actions</h3>
      </div>
      <div class="actions-content">
        <!-- Quick actions content will go here -->
      </div>
    </div>
  </div>
</div>

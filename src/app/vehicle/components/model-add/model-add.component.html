<div class="vehicle-page-bg">
  <div class="form-wrapper">
    <div class="form-card">
      <div class="form-header">
        <h3 class="form-title">Add New Model</h3>
      </div>

      <div class="form-body">
        <form [formGroup]="modelForm">
          <!-- Form Grid (2 Column Layout) -->
          <div class="form-grid">
            <!-- Brand -->
            <div class="form-group">
              <label class="form-label">Brand *</label>
              <select class="form-control form-input" formControlName="brandId">
                <option value="">Select Brand</option>
                <option *ngFor="let brand of brands" [value]="brand.brandId">
                  {{ brand.brandName }}
                </option>
              </select>

              <mat-error
                *ngIf="(submitted || f['brandId'].touched) && f['brandId'].errors"
              >
                <span *ngIf="f['brandId'].errors['required']"
                  >Brand is required</span
                >
              </mat-error>
            </div>

            <!-- Model Name -->
            <div class="form-group">
              <label class="form-label">Model Name *</label>
              <input
                type="text"
                class="form-control form-input"
                formControlName="modelName"
              />
              <mat-error
                *ngIf="(submitted || f['modelName'].touched) && f['modelName'].errors"
              >
                <span *ngIf="f['modelName'].errors['required']"
                  >Model Name is required</span
                >
                <span *ngIf="f['modelName'].errors['maxlength']"
                  >Maximum 50 characters allowed</span
                >
              </mat-error>
            </div>

          </div>
          <!-- end grid -->

          <!-- Buttons -->
          <div class="btn-row">
            <button type="button" class="btn btn-cancel" (click)="onCancel()">
              Cancel
            </button>

            <button
              type="submit"
              class="btn btn-submit"
              (click)="onSubmit()"
              [disabled]="loading"
            >
              {{ loading ? "Saving..." : "Save" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

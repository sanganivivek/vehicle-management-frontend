<div class="vehicle-page-bg">
  <div class="form-wrapper">
    <div class="form-card">
      <div class="form-header">
        <h3 class="form-title">{{ isEditMode ? 'Edit' : 'Add New' }} Customer</h3>
      </div>

      <div class="form-body">
        <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">
          <div class="form-grid">

            <div class="form-group">
              <label class="form-label">Customer Name *</label>
              <input type="text" class="form-control form-input" formControlName="name"
                placeholder="Enter customer name" />
              <div class="form-error" *ngIf="(submitted || f['name'].touched) && f['name'].errors">
                <span *ngIf="f['name'].errors['required']">Customer Name is required</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-control form-input" formControlName="email"
                placeholder="Enter email address" />
              <div class="form-error" *ngIf="(submitted || f['email'].touched) && f['email'].errors">
                <span *ngIf="f['email'].errors['required']">Email is required</span>
                <span *ngIf="f['email'].errors['email']">Enter a valid email address</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Contact Number *</label>
              <input type="text" class="form-control form-input" formControlName="contactNo"
                placeholder="10 digit number" />
              <div class="form-error" *ngIf="(submitted || f['contactNo'].touched) && f['contactNo'].errors">
                <span *ngIf="f['contactNo'].errors['required']">Contact Number is required</span>
                <span *ngIf="f['contactNo'].errors['pattern']">Enter a valid 10-digit number</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Gender *</label>
              <select class="form-control form-input" formControlName="gender">
                <option value="" disabled>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
              <div class="form-error" *ngIf="(submitted || f['gender'].touched) && f['gender'].errors">
                <span *ngIf="f['gender'].errors['required']">Gender is required</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Date of Birth *</label>
              <input type="date" class="form-control form-input" formControlName="dateOfBirth" />
              <div class="form-error" *ngIf="(submitted || f['dateOfBirth'].touched) && f['dateOfBirth'].errors">
                <span *ngIf="f['dateOfBirth'].errors['required']">Date of Birth is required</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" class="form-control form-input" formControlName="city" placeholder="Enter city" />
            </div>

            <div class="form-group">
              <label class="form-label">Status *</label>
              <select class="form-control form-input" formControlName="status">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
              <div class="form-error" *ngIf="(submitted || f['status'].touched) && f['status'].errors">
                <span *ngIf="f['status'].errors['required']">Status is required</span>
              </div>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label">Address</label>
              <textarea class="form-control form-input" formControlName="address" rows="2"
                placeholder="Enter address"></textarea>
            </div>

          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-cancel" routerLink="/customers">
              Cancel
            </button>
            <button type="submit" class="btn btn-submit" [disabled]="loading">
              {{ loading ? "Saving..." : "Save" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

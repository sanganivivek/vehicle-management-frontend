<div class="vehicle-page-bg">
  <div class="form-wrapper">
    <div class="form-card">
      <div class="form-header">
        <h3 class="form-title">Add New Vehicle</h3>
      </div>

      <div class="form-body">
        <!-- Error Message Display -->
        <div *ngIf="errorMessage" class="alert alert-danger mb-3">
          {{ errorMessage }}
        </div>
        
        <form [formGroup]="vehicleForm">
          <!-- Form Grid (2 Column Layout) -->
          <div class="form-grid">
            <!-- Registration Number -->
            <div class="form-group">
              <label class="form-label">Registration Number *</label>
              <input
                type="text"
                class="form-control form-input"
                formControlName="regNo"
              />
              <mat-error
                *ngIf="(submitted || f['regNo'].touched) && f['regNo'].errors"
              >
                <span *ngIf="f['regNo'].errors['required']"
                  >Registration Number is required</span
                >
                <span *ngIf="f['regNo'].errors['maxlength']"
                  >Maximum 20 characters allowed</span
                >
              </mat-error>
            </div>

            <!-- Brand -->
            <div class="form-group">
              <label class="form-label">Brand *</label>
              <select class="form-control form-input" formControlName="brandId">
                <option value="">Select Brand</option>
                <option *ngFor="let brand of brands" [value]="brand.brandId">
                  {{ brand.brandName }}
                </option>
              </select>

              <mat-error
                *ngIf="(submitted || f['brandId'].touched) && f['brandId'].errors"
              >
                <span *ngIf="f['brandId'].errors['required']"
                  >Brand is required</span
                >
              </mat-error>
            </div>

            <!-- Model -->
            <div class="form-group">
              <label class="form-label">Model *</label>
              <select
                class="form-control form-input"
                formControlName="modelId"
                [disabled]="!models.length"
              >
                <option value="">Select Model</option>
                <option *ngFor="let model of models" [value]="model.modelId">
                  {{ model.modelName }}
                </option>
              </select>

              <mat-error
                *ngIf="(submitted || f['modelId'].touched) && f['modelId'].errors"
              >
                <span *ngIf="f['modelId'].errors['required']"
                  >Model is required</span
                >
              </mat-error>
            </div>

            <!-- Model Year -->
            <div class="form-group">
              <label class="form-label">Model Year *</label>
              <input
                type="number"
                class="form-control form-input"
                formControlName="modelYear"
              />
              <mat-error
                *ngIf="(submitted || f['modelYear'].touched) && f['modelYear'].errors"
              >
                <span *ngIf="f['modelYear'].errors['required']"
                  >Model Year is required</span
                >
                <span *ngIf="f['modelYear'].errors['min']"
                  >Year must be 1900 or later</span
                >
                <span *ngIf="f['modelYear'].errors['max']"
                  >Year cannot be in the future</span
                >
              </mat-error>
            </div>

            <!-- Is Active -->
            <div class="form-group">
              <label class="form-label">
                <input
                  type="checkbox"
                  formControlName="isActive"
                  class="form-check-input"
                />
                Active Vehicle
              </label>
            </div>

          </div>
          <!-- end grid -->

          <!-- Buttons -->
          <div class="btn-row">
            <button type="button" class="btn btn-cancel" (click)="onCancel()">
              Cancel
            </button>

            <button
              type="submit"
              class="btn btn-submit"
              (click)="onSubmit()"
              [disabled]="vehicleForm.invalid || loading"
            >
              {{ loading ? "Saving..." : "Save" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

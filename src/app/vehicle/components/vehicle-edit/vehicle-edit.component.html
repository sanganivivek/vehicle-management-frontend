<ngx-loading [show]="saving" [config]="loadingConfig"></ngx-loading>

<div class="vehicle-page-bg">
  <div class="form-wrapper">
    <div class="form-card">
      <div class="form-header">
        <h3 class="form-title">Edit Vehicle</h3>
      </div>

      <div class="form-body">
        <!-- Loader -->
        <div *ngIf="loading" class="text-center my-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <!-- Form -->
        <form
          *ngIf="!loading"
          [formGroup]="vehicleForm"
          (ngSubmit)="onSubmit()"
        >
          <!-- 2-Column Grid -->
          <div class="form-grid">
            <!-- Vehicle Name -->
            <div class="form-group">
              <label class="form-label">Vehicle Name *</label>
              <input
                type="text"
                class="form-control form-input"
                formControlName="vehicleName"
              />
              <mat-error
                *ngIf="
                  (submitted || f['vehicleName'].touched) &&
                  f['vehicleName'].errors
                "
              >
                <span *ngIf="f['vehicleName'].errors['required']"
                  >Vehicle Name is required</span
                >
                <span *ngIf="f['vehicleName'].errors['maxlength']"
                  >Maximum 50 characters allowed</span
                >
                <span *ngIf="f['vehicleName'].errors['vehicleNameExists']"
                  >Vehicle Name already exists</span
                >
              </mat-error>
              <div class="text-muted" *ngIf="f['vehicleName'].pending">
                Checking availability...
              </div>
            </div>

            <!-- Brand -->
            <div class="form-group">
              <label class="form-label">Brand *</label>
              <select class="form-control form-input" formControlName="brandId">
                <option value="">Select Brand</option>
                <option *ngFor="let brand of brands" [value]="brand.brandId">
                  {{ brand.brandName }}
                </option>
              </select>
              <mat-error
                *ngIf="
                  (submitted || f['brandId'].touched) && f['brandId'].errors
                "
              >
                <span *ngIf="f['brandId'].errors['required']"
                  >Brand is required</span
                >
              </mat-error>
            </div>

            <!-- Model -->
            <div class="form-group">
              <label class="form-label">Model *</label>
              <select
                class="form-control form-input"
                formControlName="modelId"
                [disabled]="!models.length"
              >
                <option value="">Select Model</option>
                <option *ngFor="let model of models" [value]="model.modelId">
                  {{ model.modelName }}
                </option>
              </select>
              <mat-error
                *ngIf="
                  (submitted || f['modelId'].touched) && f['modelId'].errors
                "
              >
                <span *ngIf="f['modelId'].errors['required']"
                  >Model is required</span
                >
              </mat-error>
            </div>
          </div>
          <!-- end grid -->

          <!-- Buttons -->
          <div class="btn-row">
            <button type="button" class="btn btn-cancel" (click)="onCancel()">
              Cancel
            </button>

            <button
              type="submit"
              class="btn btn-submit"
              [disabled]="vehicleForm.invalid || loading"
            >
              <span
                *ngIf="loading"
                class="spinner-border spinner-border-sm me-2"
                role="status"
              ></span>
              {{ loading ? "Updating..." : "Update" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Dealer Management</h2>
    <a routerLink="/vehicle/add-dealer" class="btn btn-success">
      <i class="bi bi-plus-lg"></i> + Add Dealer
    </a>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="table-responsive" *ngIf="!loading">
    <table class="table table-hover table-bordered shadow-sm">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Mobile</th>
          <th>Email</th>
          <th>City</th>
          <th>Address</th>
          <th>Status</th>
          <th style="width: 150px;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dealer of dealers">
          <td class="fw-bold">{{ dealer.name }}</td>
          <td>{{ dealer.mobileNo }}</td>
          <td>{{ dealer.emailId || '-' }}</td>
          <td>{{ dealer.city || '-' }}</td>
          <td class="text-truncate" style="max-width: 150px;" title="{{dealer.address}}">{{ dealer.address || '-' }}</td>
          <td>
            <span [class]="dealer.isActive ? 'badge bg-success' : 'badge bg-secondary'">
              {{ dealer.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td>
            <a [routerLink]="['/vehicle/edit-dealer', dealer.id]" class="btn btn-sm btn-primary me-2">
              Edit
            </a>
            <button (click)="deleteDealer(dealer.id)" class="btn btn-sm btn-danger">
              Delete
            </button>
          </td>
        </tr>
        <tr *ngIf="dealers.length === 0">
          <td colspan="7" class="text-center py-4 text-muted">No dealers found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

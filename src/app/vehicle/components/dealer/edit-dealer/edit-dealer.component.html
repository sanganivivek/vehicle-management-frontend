<div class="vehicle-page-bg">
  <div class="form-wrapper">
    <div class="form-card">
      <div class="form-header">
        <h3 class="form-title">Edit Dealer</h3>
      </div>

      <div class="form-body">
        <form [formGroup]="editDealerForm">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Dealer Name *</label>
              <input type="text" class="form-control form-input" formControlName="name"
                placeholder="Enter dealer name" />
              <div class="form-error"
                *ngIf="editDealerForm.get('name')?.invalid && editDealerForm.get('name')?.touched">
                <span>Dealer Name is required</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Contact Person</label>
              <input type="text" class="form-control form-input" formControlName="contactPerson"
                placeholder="Enter contact person" />
            </div>

            <div class="form-group">
              <label class="form-label">Contact Number *</label>
              <input type="text" class="form-control form-input" formControlName="contactNo"
                placeholder="10 digit number" />
              <div class="form-error"
                *ngIf="editDealerForm.get('contactNo')?.invalid && editDealerForm.get('contactNo')?.touched">
                <span>Enter a valid 10-digit contact number</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-control form-input" formControlName="email"
                placeholder="Enter email address" />
              <div class="form-error"
                *ngIf="editDealerForm.get('email')?.invalid && editDealerForm.get('email')?.touched">
                <span>Enter a valid email address</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">GST Number</label>
              <input type="text" class="form-control form-input" formControlName="gstNo"
                placeholder="Enter GST number" />
            </div>

            <div class="form-group">
              <label class="form-label">City</label>
              <input type="text" class="form-control form-input" formControlName="city" placeholder="Enter city" />
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label">Address</label>
              <textarea class="form-control form-input" formControlName="address" rows="2"
                placeholder="Enter address"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Status *</label>
              <select class="form-control form-input" formControlName="status">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
              <div class="form-error"
                *ngIf="editDealerForm.get('status')?.invalid && editDealerForm.get('status')?.touched">
                <span>Status is required</span>
              </div>
            </div>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-cancel" routerLink="/dealers">
              Cancel
            </button>
            <button type="submit" class="btn btn-submit" (click)="onSubmit()"
              [disabled]="editDealerForm.invalid || loading" routerLink="/dealers">
              {{ loading ? "Updating..." : "Update Dealer" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

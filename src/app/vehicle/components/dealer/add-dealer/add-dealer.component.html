<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">{{ isEditMode ? 'Edit Dealer' : 'Add New Dealer' }}</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="dealerForm" (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label class="form-label">Dealer Name <span class="text-danger">*</span></label>
          <input type="text" formControlName="name" class="form-control" 
                 [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" />
          <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
            <div *ngIf="f['name'].errors['required']">Dealer Name is required</div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
            <input type="text" formControlName="mobileNo" class="form-control" 
                   [ngClass]="{ 'is-invalid': submitted && f['mobileNo'].errors }" placeholder="10 digit number" />
            <div *ngIf="submitted && f['mobileNo'].errors" class="invalid-feedback">
              <div *ngIf="f['mobileNo'].errors['required']">Mobile Number is required</div>
              <div *ngIf="f['mobileNo'].errors['pattern']">Enter a valid 10-digit number</div>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Email ID</label>
            <input type="email" formControlName="emailId" class="form-control" 
                   [ngClass]="{ 'is-invalid': submitted && f['emailId'].errors }" />
            <div *ngIf="submitted && f['emailId'].errors" class="invalid-feedback">
              <div *ngIf="f['emailId'].errors['email']">Enter a valid email address</div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">City</label>
            <input type="text" formControlName="city" class="form-control" />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Address</label>
            <textarea formControlName="address" class="form-control" rows="1"></textarea>
          </div>
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" formControlName="isActive" class="form-check-input" id="isActiveCheck">
          <label class="form-check-label" for="isActiveCheck">Is Active</label>
        </div>

        <div class="mt-4">
          <button type="submit" [disabled]="loading" class="btn btn-primary me-2">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            Save
          </button>
          <a routerLink="/vehicle/dealers" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

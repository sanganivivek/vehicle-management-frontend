<div class="vehicle-page-bg">
  <div class="form-wrapper">
    <div class="form-card">
      
      <div class="form-header">
        <h3 class="form-title">{{ isEditMode ? 'Edit' : 'Add New' }} Dealer</h3>
      </div>

      <div class="form-body">
        <form (ngSubmit)="onSubmit()" #dealerForm="ngForm">
          
          <div class="form-grid">
            
            <div class="form-group">
              <label class="form-label">Dealer ID</label>
              <input 
                type="text" 
                class="form-control form-input bg-light" 
                [value]="isEditMode ? dealerId : 'Auto-Generated'" 
                readonly 
                disabled 
                title="Dealer ID is automatically assigned">
            </div>

            <div class="form-group">
              <label class="form-label">Dealer Name <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control form-input" 
                [(ngModel)]="dealer.dealerName" 
                name="dealerName" 
                required 
                placeholder="Ex: ABC Motors">
            </div>

            <div class="form-group">
              <label class="form-label">Contact Person <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control form-input" 
                [(ngModel)]="dealer.contactPerson" 
                name="contactPerson" 
                required 
                placeholder="Ex: John Doe">
            </div>

            <div class="form-group">
              <label class="form-label">Contact Number <span class="text-danger">*</span></label>
              <input 
                type="tel" 
                class="form-control form-input" 
                [(ngModel)]="dealer.phone" 
                name="phone" 
                required
                pattern="[0-9]{10}"
                placeholder="Ex: 9876543210">
            </div>

            <div class="form-group">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input 
                type="email" 
                class="form-control form-input" 
                [(ngModel)]="dealer.email" 
                name="email" 
                required 
                email
                placeholder="admin@abcmotors.com">
            </div>

            <div class="form-group">
              <label class="form-label">Status</label>
              <select 
                class="form-control form-input" 
                [(ngModel)]="dealer.status" 
                name="status">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label">Location <span class="text-danger">*</span></label>
              <textarea 
                class="form-control form-input" 
                style="height: auto;"
                rows="3" 
                [(ngModel)]="dealer.address" 
                name="address" 
                required 
                placeholder="Enter full location/address..."></textarea>
            </div>

          </div>

          <div class="btn-row pt-3">
            <button type="button" class="btn btn-cancel" routerLink="/dealers">
              Cancel
            </button>
            <button type="submit" class="btn btn-submit" [disabled]="!dealerForm.valid">
              {{ isEditMode ? 'Update Dealer' : 'Save Dealer' }}
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

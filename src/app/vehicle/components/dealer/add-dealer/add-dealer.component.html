<div class="vehicle-page-bg">
  <div class="form-wrapper">
    <div class="form-card">
      <div class="form-header">
        <h3 class="form-title">
          {{ isEditMode ? "Edit" : "Add New" }} Dealer
        </h3>
      </div>

      <div class="form-body">
        <form [formGroup]="dealerForm">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Dealer Name *</label>
              <input type="text" class="form-control form-input" formControlName="dealerName"
                placeholder="e.g. City Motors" />
              <div class="form-error" *ngIf="(submitted || f['dealerName'].touched) && f['dealerName'].errors">
                <span *ngIf="f['dealerName'].errors['required']">Dealer Name is required</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Contact Person *</label>
              <input type="text" class="form-control form-input" formControlName="contactPerson"
                placeholder="e.g. John Doe" />
              <div class="form-error" *ngIf="(submitted || f['contactPerson'].touched) && f['contactPerson'].errors">
                <span *ngIf="f['contactPerson'].errors['required']">Contact Person is required</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Email Address *</label>
              <input type="email" class="form-control form-input" formControlName="email"
                placeholder="name@example.com" />
              <div class="form-error" *ngIf="(submitted || f['email'].touched) && f['email'].errors">
                <span *ngIf="f['email'].errors['required']">Email is required</span>
                <span *ngIf="f['email'].errors['email']">Invalid email format</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Location / Address *</label>
              <textarea class="form-control form-input" rows="3" formControlName="address"
                placeholder="Enter Full Address"></textarea>
              <div class="form-error" *ngIf="(submitted || f['address'].touched) && f['address'].errors">
                <span *ngIf="f['address'].errors['required']">Address is required</span>
              </div>
            </div>

            <div class="form-group d-flex align-items-center gap-2">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" formControlName="isActive" id="isActiveCheck" />
                <label class="form-check-label" for="isActiveCheck">
                  Is Active?
                </label>
              </div>
            </div>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-danger" *ngIf="isEditMode" (click)="deleteDealer()">
              Delete
            </button>
            <button type="button" class="btn btn-cancel" (click)="onCancel()">
              Cancel
            </button>
            <button type="submit" class="btn btn-submit" (click)="onSubmit()" [disabled]="dealerForm.invalid || loading">
              {{ loading ? "Saving..." : "Save" }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

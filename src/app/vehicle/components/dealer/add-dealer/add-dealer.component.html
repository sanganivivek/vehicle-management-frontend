<div class="dealer-page-bg">
  <div class="dealer-container mt-4 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="title">{{ isEditMode ? 'Edit Dealer' : 'Add New Dealer' }}</h2>
      <button class="btn btn-outline-secondary" routerLink="/vehicle/dealers">
        <i class="bi bi-arrow-left me-2"></i> Back to List
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" #dealerForm="ngForm" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Dealer Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="dealer.dealerName" name="dealerName" required placeholder="Ex: ABC Motors">
      </div>

      <div class="col-md-6">
        <label class="form-label">Contact Person <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="dealer.contactPerson" name="contactPerson" required placeholder="Ex: John Doe">
      </div>

      <div class="col-md-6">
        <label class="form-label">Email Address <span class="text-danger">*</span></label>
        <input type="email" class="form-control" [(ngModel)]="dealer.email" name="email" required email placeholder="admin@abcmotors.com">
      </div>

      <div class="col-md-6">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-control" [(ngModel)]="dealer.phone" name="phone" placeholder="Ex: +1 234 567 8900">
      </div>

      <div class="col-12">
        <label class="form-label">Location / Address <span class="text-danger">*</span></label>
        <textarea class="form-control" rows="3" [(ngModel)]="dealer.address" name="address" required placeholder="Full street address..."></textarea>
      </div>

      <div class="col-12">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="statusSwitch" [(ngModel)]="dealer.isActive" name="isActive">
          <label class="form-check-label" for="statusSwitch">Active Status</label>
        </div>
      </div>

      <div class="col-12 mt-4 d-flex gap-2 justify-content-end">
        <button type="button" class="btn btn-secondary" routerLink="/vehicle/dealers">Cancel</button>
        <button type="submit" class="btn btn-primary px-4" [disabled]="!dealerForm.valid">
          {{ isEditMode ? 'Update Dealer' : 'Save Dealer' }}
        </button>
      </div>
    </form>
  </div>
</div>

<div class="container">
  <h2>Fleet Status & Compliance Report</h2>

  <table class="simple-table">
    <thead>
      <tr>
        <th>Reg No</th>

        <th>Brand</th>
        <th>Model</th>
        <th>Status</th>
        <th>Compliance</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let v of vehicles">
        <td>{{ v.regNo }}</td>

        <td>{{ v.brandName }}</td>
        <td>{{ v.modelName }}</td>

        <td>
          <span
            class="status-badge"
            [ngClass]="getStatusClass(v.currentStatus)"
          >
            {{ getStatusText(v.currentStatus) }}
          </span>
        </td>

        <td
          [style.color]="isCompliant(v) ? 'green' : 'red'"
          style="font-weight: bold"
        >
          {{ isCompliant(v) ? "COMPLIANT" : "NON-COMPLIANT" }}
        </td>
      </tr>

      <tr *ngIf="vehicles.length === 0" class="empty-row">
        <td colspan="5">
          <div class="empty-message">
            <i class="bi bi-inbox"></i>
            <span>No vehicles found.</span>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="vehicle-page-bg">
    <div class="vehicle-container">
        <div class="header-section" *ngIf="showHeader">
            <h2 class="title">Model List</h2>
            <button class="custom-add-btn" routerLink="/models/add">
                + Add Model
            </button>
        </div>

        <div class="table-wrapper">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Brand Code</th>
                        <th>Brand Name</th>
                        <th>Model Code</th>
                        <th>Model Name</th>

                        <th>Description</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let model of models">
                        <td>{{ model.brandCode || '-' }}</td>
                        <td>{{ model.brandName || 'Unknown' }}</td>
                        <td>{{ model.modelCode || '-' }}</td>
                        <td>{{ model.modelName || '-' }}</td>

                        <td>{{ model.description || '-' }}</td>
                        <td>
                            <div class="d-flex align-items-center justify-content-center gap-3">
                                <div class="action-icons d-flex gap-2">
                                    <button class="btn btn-sm btn-outline-primary"
                                        [routerLink]="['/models/edit', model.modelId]">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" (click)="deleteModel(model.modelId)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="models.length === 0 && !loading">
                        <td colspan="7" style="text-align: center; padding: 20px; color: #6c757d;">
                            No models found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div *ngIf="loading" style="text-align: center; padding: 20px;">
            Loading...
        </div>
    </div>
</div>

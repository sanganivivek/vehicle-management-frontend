<div class="vehicle-page-bg">
  <div class="vehicle-container">
    <div class="header-section mb-4">
      <h2 class="title">Edit Model</h2>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted">Loading model details...</p>
    </div>

    <form *ngIf="!loading" [formGroup]="editModelForm" (ngSubmit)="onSubmit()">
      
      <div class="row g-3">
        
        <div class="col-md-6">
          <label class="form-label fw-bold">Brand <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="brandId" 
                  [class.is-invalid]="editModelForm.get('brandId')?.invalid && editModelForm.get('brandId')?.touched">
            <option value="">Select Brand</option>
            <option *ngFor="let brand of brands" [value]="brand.brandId">
              {{ brand.brandName }}
            </option>
          </select>
          <div class="invalid-feedback">
            Please select a brand.
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Model Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="modelCode" placeholder="Enter model code"
                 [class.is-invalid]="editModelForm.get('modelCode')?.invalid && editModelForm.get('modelCode')?.touched" />
          <div class="invalid-feedback">
            Model code is required.
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Model Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="modelName" placeholder="Enter model name"
                 [class.is-invalid]="editModelForm.get('modelName')?.invalid && editModelForm.get('modelName')?.touched" />
          <div class="invalid-feedback">
            Model name is required.
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-bold">Description</label>
          <textarea class="form-control" formControlName="description" rows="3" placeholder="Enter description"
                    [class.is-invalid]="editModelForm.get('description')?.invalid && editModelForm.get('description')?.touched"></textarea>
          <div class="invalid-feedback">
             Description is too long.
          </div>
        </div>

      </div>

      <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
        <button type="button" class="btn btn-secondary px-4" (click)="onCancel()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary px-4" [disabled]="submitting || editModelForm.invalid">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
          {{ submitting ? 'Updating...' : 'Update Model' }}
        </button>
      </div>

    </form>
  </div>
</div>

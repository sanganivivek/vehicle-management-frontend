<div class="vehicle-page-bg">
  <div class="form-wrapper">
    <div class="form-card">
      <div class="form-header">
        <h3 class="form-title">Edit Model</h3>
      </div>

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Loading model details...</p>
      </div>

      <div class="form-body" *ngIf="!loading">
        <form [formGroup]="editModelForm" (ngSubmit)="onSubmit()">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Brand *</label>
              <select class="form-control form-input" formControlName="brandId">
                <option value="">Select Brand</option>
                <option *ngFor="let brand of brands" [value]="brand.brandId">
                  {{ brand.brandName }}
                </option>
              </select>
              <div class="form-error"
                *ngIf="(editModelForm.get('brandId')?.touched || submitting) && editModelForm.get('brandId')?.errors">
                <span *ngIf="editModelForm.get('brandId')?.errors?.['required']">Brand is required</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Model Code *</label>
              <input type="text" class="form-control form-input" formControlName="modelCode"
                placeholder="Enter model code" />
              <div class="form-error"
                *ngIf="(editModelForm.get('modelCode')?.touched || submitting) && editModelForm.get('modelCode')?.errors">
                <span *ngIf="editModelForm.get('modelCode')?.errors?.['required']">Model code is required</span>
                <span *ngIf="editModelForm.get('modelCode')?.errors?.['maxlength']">Max 20 characters allowed</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Model Name *</label>
              <input type="text" class="form-control form-input" formControlName="modelName"
                placeholder="Enter model name" />
              <div class="form-error"
                *ngIf="(editModelForm.get('modelName')?.touched || submitting) && editModelForm.get('modelName')?.errors">
                <span *ngIf="editModelForm.get('modelName')?.errors?.['required']">Model name is required</span>
                <span *ngIf="editModelForm.get('modelName')?.errors?.['maxlength']">Max 50 characters allowed</span>
              </div>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label">Description</label>
              <textarea class="form-control form-input" formControlName="description" rows="3"
                placeholder="Enter description"></textarea>
              <div class="form-error"
                *ngIf="(editModelForm.get('description')?.touched || submitting) && editModelForm.get('description')?.errors">
                <span *ngIf="editModelForm.get('description')?.errors?.['maxlength']">Max 200 characters allowed</span>
              </div>
            </div>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-cancel" (click)="onCancel()">
              Cancel
            </button>
            <button type="submit" class="btn btn-submit" [disabled]="submitting">
              {{ submitting ? 'Updating...' : 'Update Model' }}
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

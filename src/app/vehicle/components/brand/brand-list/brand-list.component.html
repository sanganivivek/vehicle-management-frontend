<div class="vehicle-page-bg">
  <div class="vehicle-container">
    <div class="header-section" *ngIf="showHeader">
      <h2 class="title">Brand List</h2>
      <button class="custom-add-btn" routerLink="/brands/add">
        + Add Brand
      </button>
    </div>

    <div class="table-wrapper">
      <table class="custom-table">
        <thead>
          <tr>
            <th>Brand Code</th>
            <th>Brand Name</th>
            <th>Status</th>
            <th style="text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let brand of brands">
            <td>{{ brand.brandCode }}</td>
            <td>{{ brand.brandName }}</td>
            <td>
              <span class="status-badge" [ngClass]="brand.isActive ? 'active' : 'inactive'">
                {{ brand.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td>
              <div class="action-icons">
                <button class="icon-btn edit-icon" [routerLink]="['/vehicle/brands/edit', brand.brandId]">
                  Edit
                </button>
                <button class="icon-btn delete-icon" (click)="deleteBrand(brand.brandId)">
                  Delete
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="brands.length === 0 && !loading">
            <td colspan="4" style="text-align: center; padding: 20px; color: #6c757d;">
              No brands found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="loading" style="text-align: center; padding: 20px;">
      Loading...
    </div>
  </div>
</div>

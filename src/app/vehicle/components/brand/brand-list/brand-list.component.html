<div class="vehicle-page-bg">
  <div class="vehicle-container mt-4">
    <div class="header-section d-flex justify-content-between align-items-center mb-4" *ngIf="showHeader">
      <h2 class="title mb-0">Brand List</h2>
      <button class="btn btn-primary custom-add-btn" routerLink="/brands/add">
        <i class="bi bi-plus-lg me-2"></i> Add New Brand
      </button>
    </div>

    <div class="table-wrapper shadow-sm rounded bg-white">
      <table class="table custom-table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Brand Code</th>
            <th>Brand Name</th>
            <th>Status</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let brand of brands">
            <td>{{ brand.brandCode }}</td>
            <td>{{ brand.brandName }}</td>
            <td>
              <span [class]="brand.isActive ? 'badge bg-success' : 'badge bg-secondary'">
                {{ brand.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td>
              <div class="d-flex align-items-center justify-content-center gap-3">
                <div class="action-icons d-flex gap-2">
                  <button class="btn btn-sm btn-outline-primary" [routerLink]="['/brands/edit', brand.brandId]">
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteBrand($event, brand.brandId)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </td>
          </tr>
          <tr *ngIf="brands.length === 0 && !loading">
            <td colspan="4" class="text-center py-4 text-muted empty-state">
              <i class="bi bi-inbox fs-1 d-block mb-2"></i>
              No brands found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="loading" style="text-align: center; padding: 20px;">
      Loading...
    </div>
  </div>
</div>
